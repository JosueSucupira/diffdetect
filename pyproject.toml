[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffdetect"
version = "0.1.0a0"
description = "Modular image analysis with diffusion detector adapters"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Josué Sucupira" }]
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
experiments = ["scikit-learn>=1.4,<2"]

[tool.setuptools.packages.find]
where = ["src"]
